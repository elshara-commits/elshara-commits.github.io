<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="A simple Hello, world! example.">
    <title>Hello, world! — Elshara</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #111827;
        color: #f9fafb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        padding: 2rem;
        text-align: center;
      }

      p {
        margin: 0 0 0.75rem;
        color: #a5b4fc;
        font-size: 0.875rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        letter-spacing: -0.06em;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Welcome to my website</p>
      <h1>Hello, world!</h1>
    </main>
  </body>
</html>
